templates:
    1: &auto
        type: float
        subgrades:
            points: integer
        calculation: (points >= 9) && points || 0
        automatic:
            points: (correctness_score * 10).floor
        auto_publish: true
        hide_calculated: false
        hide_subgrades: false

    2: &check
        type: boolean
        subgrades:
            passed: boolean
        calculation: passed
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false

    3: &testt
        type: boolean
        subgrades:
            passed: boolean
            checkpy: float
        automatic:
            checkpy: correctness_score * 10
        calculation: passed
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false



grades:
    #### SP 1 ####
    m1-grade:
        type: float
        subgrades:
            correctness_base: float
            goldbach: boolean
            amicable: boolean
            eratosthenes: boolean
        calculation: "(1.0 + 6.0 * correctness_base / 10 + goldbach * -1.0 + amicable * -1.0 + eratosthenes * - 1.0).round(1)"
    m2-grade: *check
    m3-grade: *check
    m4-grade: *check
    m5-grade: *check
    m6-grade: *check


    1_1n: *auto
    1_2n: *auto
    1_3n: *auto
    1_4n: *auto
    1_5n: *auto
    1_6n: *auto
    c-goldbach: *auto
    c-amicable: *auto
    c-eratosthenes: *auto

    2_1i: *auto
    2_2i: *auto
    2_3i: *auto
    2_4i: *auto
    2_5i: *auto
    2_6i: *auto
    c-montecarlo: *auto
    c-egg: *auto
    c-plot-min-max: *check

    3_1b: *auto
    3_2b: *auto
    c-datastructures1: *auto
    c-datastructures2: *auto
    c-shakespeare: *auto

    4_1m: *auto
    4_2m: *auto
    c-animation: *check
    c-conway: *check

    5_1m: *auto
    5_2m: *check
    5_3m: *auto

    6_1s: *check
    6_2s: *check
    6_3s: *check

    exam1: *testt
    exam2: *testt


