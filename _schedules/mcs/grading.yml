templates:
    1: &auto
        type: float
        subgrades:
            points: integer
        calculation: (points >= 10) && points || 0
        automatic:
            points: (correctness_score * 10).floor
        auto_publish: true
        hide_calculated: false
        hide_subgrades: true

    2: &check
        type: float
        subgrades:
            passed: boolean
        calculation: "passed * -10"
        auto_publish: false
        hide_calculated: false
        hide_subgrades: true

    3: &grade1
        type: float
        subgrades:
            correctness_base: float
            challenge_1: boolean
        calculation: "(1.0 + 6.0 * correctness_base / 10 + challenge_1 * -3.0).round(1)"
        auto_publish: false
        hide_calculated: false
        hide_subgrades: false

    4: &grade2
        type: float
        subgrades:
            correctness_base: float
            challenge_1: boolean
            challenge_2: boolean
        calculation: "(1.0 + 6.0 * correctness_base / 10 + challenge_1 * -1.5 + challenge_2 * -1.5).round(1)"
        auto_publish: false
        hide_calculated: false
        hide_subgrades: false

    5: &grade3
        type: float
        subgrades:
            correctness_base: float
            challenge_1: boolean
            challenge_2: boolean
            challenge_3: boolean
        calculation: "(1.0 + 6.0 * correctness_base / 10 + challenge_1 * -1.0 + challenge_2 * -1.0 + challenge_3 * -1.0).round(1)"
        auto_publish: false
        hide_calculated: false
        hide_subgrades: false

    6: &grade2-bonus
        type: float
        subgrades:
            correctness_base: float
            challenge_1: boolean
            challenge_2: boolean
            bonus: boolean
        calculation: "(1.0 + 6.0 * correctness_base / 10 + challenge_1 * -1.5 + challenge_2 * -1.5 + bonus * -1.0).round(1)"
        auto_publish: false
        hide_calculated: false
        hide_subgrades: false


    7: &testt
        type: float
        subgrades:
            checkpy: float
        automatic:
            checkpy: correctness_score * 9 + 1
        calculation: checkpy
        auto_publish: true
        hide_calculated: true
        hide_subgrades: false

    8: &quiz
        type: pass
        subgrades:
            checkpy: float
        automatic:
            checkpy: correctness_score * 10
        calculation: (checkpy >= 10) && -1 || 0
        auto_publish: true
        hide_calculated: true
        hide_subgrades: false


